[project]
name = "ace-anime-discovery"
version = "0.1.0"
description = "Independent evidence-led anime/manga discovery, crawling and review"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "playwright==1.65.2",
    "requests==2.34.2",
    "typing-extensions==4.15.0",
]

[project.scripts]
ace-anime-discover = "ace_anime_discovery.anime_discovery:main"
ace-anime-propose = "ace_anime_discovery.propose_anime_sites:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ace_anime_discovery"]
