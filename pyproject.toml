[project]
name = "ace-hosts"
version = "0.1.0"
description = "Download, merge, deduplicate and split host lists for DNS-based blocking (Python successor of the columndeeply/hosts tooling)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ace Project contributors" }]
keywords = ["hosts", "blocklist", "dns", "pihole", "adguard", "porn-blocker", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
# Direct dependencies are pinned exactly (no floating ranges) so the project
# is reproducible even outside the uv.lock. Transitive dependencies are
# resolved and locked deterministically in uv.lock.
dependencies = [
    "httpx==0.25.0",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "tqdm==4.66.1",
]

[project.scripts]
ace-hosts-download = "scripts.download_sources:main"
ace-hosts-merge = "scripts.merge_hosts:main"
ace-hosts-split = "scripts.split_hosts:main"

[dependency-groups]
dev = ["basedpyright==1.39.10", "pytest==9.1.1"]

[tool.basedpyright]
# This codebase is CLI-heavy: argparse registration uses expression statements
# whose results (Action objects, return values) are intentionally discarded.
# Keep this diagnostic off project-wide to avoid ~25 lines of noise.
reportUnusedCallResult = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
