name: Anime Manga discovery (review PR)

on:
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:
    inputs:
      crawl_requests:
        description: "Maximum HTTP requests per run (1-10000)"
        type: number
        default: 220
      crawl_seconds:
        description: "Maximum crawl runtime in seconds (1-7200)"
        type: number
        default: 600
      crawl_depth:
        description: "Maximum link discovery depth (0-6)"
        type: number
        default: 3

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: anime-manga-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Restore incremental crawler state
        uses: actions/cache@v4
        with:
          path: downloads/anime-discovery/crawl-state.sqlite
          key: ${{ runner.os }}-anime-crawl-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-anime-crawl-
      - name: Fetch curated and discovery-only sources
        run: |
          uv run python scripts/download_sources.py --category anime-manga --no-rate-limit
      - name: Build existing anime/manga baseline
        run: uv run python scripts/merge_hosts.py --category anime-manga --no-progress
      - name: Discover public web and verify candidates
        env:
          ACE_DISCOVERY_BRAVE_API_KEY: ${{ secrets.ACE_DISCOVERY_BRAVE_API_KEY }}
          CRAWL_REQUESTS: ${{ inputs.crawl_requests || 220 }}
          CRAWL_SECONDS: ${{ inputs.crawl_seconds || 600 }}
          CRAWL_DEPTH: ${{ inputs.crawl_depth || 3 }}
        run: |
          uv run python scripts/anime_discovery.py --refresh --scrape-sites --browser-fallback \
            --max-scrape-sites 60 --max-browser-sites 15 --crawl-web \
            --crawl-requests "$CRAWL_REQUESTS" --crawl-seconds "$CRAWL_SECONDS" \
            --crawl-depth "$CRAWL_DEPTH"
      - name: Propose new sites for human review
        run: uv run python scripts/propose_anime_sites.py
      - name: Validate the proposed anime/manga list and tests
        run: |
          uv run python scripts/merge_hosts.py --category anime-manga --no-progress
          uv run pytest -q
          uv run basedpyright
      - name: Publish complete review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anime-manga-discovery-review
          path: |
            downloads/anime-discovery/candidates.jsonl
            downloads/anime-discovery/summary.json
            downloads/anime-discovery/eligible-anime.txt
            downloads/anime-discovery/pr-body.md
            downloads/anime-discovery/crawl-report.json
            downloads/anime-discovery/crawl-report.md
            downloads/anime-discovery/crawl-state.sqlite
          if-no-files-found: warn
          retention-days: 30
      - name: Protect a previously reviewed proposal branch
        id: review_lock
        env:
          GH_TOKEN: ${{ secrets.ANIME_DISCOVERY_PR_TOKEN || github.token }}
        run: |
          reviews=$(gh pr view automation/anime-discovery --json reviews --jq '.reviews | length' 2>/dev/null || echo 0)
          manual=$(gh pr view automation/anime-discovery --json commits --jq '[.commits[].messageHeadline | select(. != "chore: propose anime sites for review")] | length' 2>/dev/null || echo 0)
          if [ "$reviews" -gt 0 ] || [ "$manual" -gt 0 ]; then
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "Existing PR has reviews or manual commits; preserving its branch and edits. New findings remain in this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create or update review PR
        if: steps.review_lock.outputs.locked != 'true'
        id: review_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ANIME_DISCOVERY_PR_TOKEN || github.token }}
          branch: automation/anime-discovery
          base: main
          delete-branch: true
          add-paths: seeds/anime-manga.txt
          commit-message: "chore: propose anime sites for review"
          title: "Anime Discovery: new sites for review"
          body-path: downloads/anime-discovery/pr-body.md

      - name: Explain blocked PR permissions and preserve manual review link
        if: steps.review_pr.outcome == 'failure'
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "::warning title=Anime Discovery PR blocked::Discovery completed, but GitHub denied creating the PR. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General, or configure ANIME_DISCOVERY_PR_TOKEN."
          {
            echo "### Anime Discovery: PR creation blocked"
            echo
            echo "Discovery and tests succeeded, but GitHub refused PR creation."
            echo "Open the proposed branch and create the PR manually:"
            echo
            echo "https://github.com/${GH_REPOSITORY}/compare/main...automation/anime-discovery?expand=1"
            echo
            echo "For automation, enable **Settings → Actions → General → Allow GitHub Actions to create and approve pull requests**, or configure the ANIME_DISCOVERY_PR_TOKEN secret with authorized repository permissions."
            echo "The unmerged discovery branch does not affect the published Release."
          } >> "${GITHUB_STEP_SUMMARY}"
          # Keep the run red: an uncreated PR is an incomplete discovery workflow.
          exit 1
