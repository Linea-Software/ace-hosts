name: Release

on:
  schedule:
    # First day of every month at 03:00 UTC.
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Download sources
        run: uv run python scripts/download_sources.py --all-categories --no-rate-limit

      - name: Clean output
        run: rm -f hosts/*

      - name: Merge and split
        run: uv run python scripts/merge_hosts.py --all-categories --split --no-progress

      - name: Generate checksums
        working-directory: hosts
        run: sha256sum * > sha256_checksums.txt

      - name: Build release notes
        run: |
          generated=$(grep -m1 '^# Generated:' hosts/merged_hosts.txt | awk '{print $3}')
          cat > /tmp/release-body.md <<EOF
          Automated monthly build of the Ace category blocklists.

          - Generated: ${generated}
          - Adult compatibility assets: merged_hosts.txt and hosts00..hostsNN
          - Other categories: <category>.txt and <category>-hosts00..NN

          Unique domains by category:
          EOF

          for entry in \
            "adult:hosts/merged_hosts.txt" \
            "gaming:hosts/gaming.txt" \
            "social:hosts/social.txt" \
            "gambling:hosts/gambling.txt" \
            "streaming:hosts/streaming.txt" \
            "dating:hosts/dating.txt" \
            "shopping:hosts/shopping.txt"; do
            category="${entry%%:*}"
            file="${entry#*:}"
            count=$(grep -m1 '^# Entries:' "$file" | awk '{print $3}')
            echo "- ${category}: ${count}" >> /tmp/release-body.md
          done

          cat >> /tmp/release-body.md <<EOF

          Each generated file records its upstream source names and license labels.
          Source details: https://github.com/Linea-Software/ace-hosts#built-in-categories-and-sources
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists, replacing it"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            --title "Host lists $(date -u +%Y-%m-%d)" \
            --notes-file /tmp/release-body.md \
            hosts/*
