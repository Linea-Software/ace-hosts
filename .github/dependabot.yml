version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime-minor-patch:
        patterns:
          - python-dotenv
          - requests
          - tqdm
          - xxhash
        update-types: [minor, patch]
      python-dev-tools-minor-patch:
        patterns:
          - basedpyright
          - pytest
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
